<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Encounter - WUB TECH SOLUTIONS Clinic</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div class="mb-4">
                <a
                    href="{% url 'patients:detail' patient.id %}"
                    class="text-decoration-none"
                >
                    ← Back to Patient
                </a>
            </div>

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <div class="mb-4">
                        <h3 class="fw-bold mb-1">
                            New Encounter
                        </h3>

                        <p class="text-muted mb-0">
                            Create a new clinical visit for this patient.
                        </p>
                    </div>

                    <!-- Patient information -->

                    <div class="bg-light rounded p-3 mb-4">

                        <div class="row">

                            <div class="col-md-8">
                                <div class="text-muted small">
                                    Patient
                                </div>

                                <div class="fw-semibold fs-5">
                                    {{ patient.full_name }}
                                </div>
                            </div>

                            <div class="col-md-4 mt-3 mt-md-0">
                                <div class="text-muted small">
                                    Patient ID
                                </div>

                                <div class="fw-semibold">
                                    {{ patient.patient_id }}
                                </div>
                            </div>

                        </div>

                    </div>

                    <!-- Encounter form -->

                    <form method="post">

                        {% csrf_token %}

                        <div class="mb-4">

                            <label
                                for="visit_reason"
                                class="form-label fw-semibold"
                            >
                                Visit Reason
                            </label>

                            <textarea
                                name="visit_reason"
                                id="visit_reason"
                                class="form-control"
                                rows="5"
                                placeholder="Why is the patient visiting the clinic today?"
                            ></textarea>

                            <div class="form-text">
                                Enter the main reason for this visit.
                            </div>

                        </div>

                        <div class="d-flex justify-content-end gap-2">

                            <a
                                href="{% url 'patients:detail' patient.id %}"
                                class="btn btn-outline-secondary"
                            >
                                Cancel
                            </a>

                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Create Encounter
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>
    </div>

</div>

</body>
</html>
