{% extends "school/base_school.html" %}
{% block school_content %}
<h4>New Invoice — {{ student.full_name }}</h4>
<form method="post" class="card"><div class="card-body">{% csrf_token %}{{ form.as_p }}<div class="mb-3"><label class="form-label">Fee type</label><select name="fee_type" class="form-select" required>{% for fee in fees %}<option value="{{ fee.id }}">{{ fee.name }} — {{ fee.amount }} ETB</option>{% endfor %}</select></div><div class="mb-3"><label class="form-label">Quantity</label><input name="quantity" type="number" min="1" value="1" class="form-control"></div><button class="btn btn-primary">Create invoice</button></div></form>
{% endblock %}
