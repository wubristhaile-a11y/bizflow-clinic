{% extends "school/base_school.html" %}
{% block school_content %}
<div class="d-flex justify-content-between mb-3"><h4>Gradebook</h4><a class="btn btn-primary" href="{% url 'school:assessment_create' %}">+ New assessment</a></div>
<div class="card"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>Date</th><th>Assessment</th><th>Subject</th><th>Class</th><th>Term</th></tr></thead><tbody>{% for a in assessments %}<tr><td>{{ a.date }}</td><td><a href="{% url 'school:assessment_detail' a.id %}">{{ a.name }}</a></td><td>{{ a.subject.name }}</td><td>{{ a.section }}</td><td>{{ a.term.name }}</td></tr>{% empty %}<tr><td colspan="5" class="text-muted text-center py-4">No assessments.</td></tr>{% endfor %}</tbody></table></div></div>
{% endblock %}
