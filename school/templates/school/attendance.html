{% extends "school/base_school.html" %}
{% block school_content %}
<h4 class="mb-3">Attendance</h4>
<form method="get" class="row g-2 mb-3"><div class="col-md-6"><select name="section" class="form-select"><option value="">Select section</option>{% for s in sections %}<option value="{{ s.id }}" {% if section.id == s.id %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div><div class="col-auto"><button class="btn btn-primary">Open</button></div></form>
{% if section %}<form method="post" class="card"><div class="card-body">{% csrf_token %}<div class="mb-3"><label class="form-label">Date</label><input type="date" name="attendance_date" value="{{ today|date:'Y-m-d' }}" class="form-control" style="max-width:220px"></div><div class="table-responsive"><table class="table"><thead><tr><th>Roll</th><th>Student</th><th>Status</th></tr></thead><tbody>{% for e in enrollments %}<tr><td>{{ e.roll_number|default:"—" }}</td><td>{{ e.student.full_name }}</td><td><select name="status_{{ e.id }}" class="form-select"><option value="PRESENT">Present</option><option value="ABSENT">Absent</option><option value="LATE">Late</option><option value="EXCUSED">Excused</option></select></td></tr>{% endfor %}</tbody></table></div><button class="btn btn-primary">Save attendance</button></div></form>{% endif %}
{% endblock %}
